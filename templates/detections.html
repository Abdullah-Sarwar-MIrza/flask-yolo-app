<!doctype html>
<html lang="en">
<head><title>Detection Results</title></head>
<body>
  <h1>All Detection Results</h1>
  <table border="1">
    <tr><th>ID</th><th>Image</th><th>Label</th><th>Confidence</th><th>XMin</th><th>YMin</th><th>XMax</th><th>YMax</th><th>Time</th></tr>
    {% for d in detections %}
      <tr>
        <td>{{ d[0] }}</td>
        <td>{{ d[1] }}</td>
        <td>{{ d[2] }}</td>
        <td>{{ '%.2f' % d[3] }}</td>
        <td>{{ d[4] }}</td>
        <td>{{ d[5] }}</td>
        <td>{{ d[6] }}</td>
        <td>{{ d[7] }}</td>
        <td>{{ d[8] }}</td>
      </tr>
    {% endfor %}
  </table>
  <br><a href="/">Back</a>
</body>
</html>
